<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JACEK GYM - Acceso Admin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header class="logo-header">
        <img src="assets/icons/logo.svg" alt="Jacek gym logo">
        <span>JACEK GYM</span>
    </header>

    <main class="login-page">
        <section class="login-card">
            <div class="login-content">
                <h1>Iniciar sesión en Panel de Administrador</h1>
                <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

                <div class="error-message" id="errorMessage"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <div class="input-field">
                            <span class="field-icon" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16v16H4z"></path>
                                    <path d="m4 8 8 6 8-6"></path>
                                </svg>
                            </span>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="admin@jacekgym.com"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="password-field input-field">
                            <span class="field-icon" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="4" y="11" width="16" height="9" rx="2"></rect>
                                    <path d="M8 11V8a4 4 0 1 1 8 0v3"></path>
                                </svg>
                            </span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                required
                            >
                            <button type="button" id="togglePasswordBtn" class="password-toggle" aria-label="Mostrar contraseña" aria-pressed="false">
                                <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="m3 3 18 18"></path>
                                    <path d="M10.58 10.58A2 2 0 0 0 12 14a2 2 0 0 0 1.42-.58"></path>
                                    <path d="M9.88 5.09A9.77 9.77 0 0 1 12 4c7 0 11 8 11 8a18.68 18.68 0 0 1-4.24 5.09"></path>
                                    <path d="M6.61 6.61A18.55 18.55 0 0 0 1 12s4 8 11 8a9.77 9.77 0 0 0 5.39-1.61"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="login-button" id="submitButton">
                        <span class="text">Iniciar sesión</span>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        © 2026 JACEK GYM. Todos los derechos reservados.
    </footer>
    
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/loginPage.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
